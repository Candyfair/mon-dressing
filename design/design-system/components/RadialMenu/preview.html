<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RadialMenu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
</head>
<body>
<div class="md-stage" style="background: rgba(19,27,22,0.55); border-radius: 16px">
<div class="md-col"><span class="md-radial-label"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--recommend)"></span>Conseillé : aérer</span></div>
<span class="md-radial" aria-label="Favori"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none"></path></svg></span>
<span class="md-radial is-recommended" aria-label="Aérer, conseillé"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h10.5a2.5 2.5 0 1 0-2.5-2.5M3 14h14.5a2.5 2.5 0 1 1-2.5 2.5"></path></svg></span>
<span class="md-radial" aria-label="Au sale"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.2"></circle><path d="M7.5 6.5h2.5"></path></svg></span>
<span class="md-radial is-hover" aria-label="Ranger"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="17" rx="1.5"></rect><path d="M12 3v17M9.8 10.5v2.5M14.2 10.5v2.5M7 20v1.5M17 20v1.5"></path></svg></span>
</div>
</body>
</html>
