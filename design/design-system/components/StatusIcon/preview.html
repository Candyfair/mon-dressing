<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>StatusIcon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
</head>
<body>
<div class="md-stage">
<div class="md-col"><span class="md-status md-st-favori" role="img" aria-label="Favori"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"></path></svg></span><span class="md-caption">Favori</span></div>
<div class="md-col"><span class="md-status md-st-balcon" role="img" aria-label="Sur le balcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h10.5a2.5 2.5 0 1 0-2.5-2.5M3 14h14.5a2.5 2.5 0 1 1-2.5 2.5"></path></svg></span><span class="md-caption">Sur le balcon</span></div>
<div class="md-col"><span class="md-status md-st-sale" role="img" aria-label="Au sale"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.2"></circle><path d="M7.5 6.5h2.5"></path></svg></span><span class="md-caption">Au sale</span></div>
<div class="md-col"><span class="md-status md-st-secher" role="img" aria-label="À sécher"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3L4 5.5l1.6 3 1.9-1V14h9V7.5l1.9 1 1.6-3L15.5 3c-.8 1-2 1.5-3.5 1.5S9.3 4 8.5 3z"></path><path d="M12 16.5s-1.8 2.1-1.8 3.4a1.8 1.8 0 0 0 3.6 0c0-1.3-1.8-3.4-1.8-3.4z"></path></svg></span><span class="md-caption">À sécher</span></div>
<div class="md-col"><span class="md-status md-st-etendoir" role="img" aria-label="Sur l’étendoir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5c4 2 16 2 20 0"></path><path d="M8.2 9.2L5 11.2l1.4 2.9 1.6-.9V20h8v-6.8l1.6.9 1.4-2.9-3.2-2c-.8.9-2.2 1.4-3.8 1.4s-3-.5-3.8-1.4z"></path><path d="M8.5 4.8v3.2M15.5 4.8v3.2"></path></svg></span><span class="md-caption">Sur l’étendoir</span></div>
<div class="md-col"><span class="md-status md-st-repasser" role="img" aria-label="À repasser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h19.5v-5a4 4 0 0 0-4-4H9.5C6 9 3.4 12.2 2 18z"></path><path d="M10 9V7.5A1.5 1.5 0 0 1 11.5 6h6.5a1.5 1.5 0 0 1 1.5 1.5v2"></path><path d="M6 15h.01M9 15h.01M12 15h.01"></path></svg></span><span class="md-caption">À repasser</span></div>
<div class="md-col"><span class="md-status-mini md-st-etendoir" role="img" aria-label="Sur l’étendoir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5c4 2 16 2 20 0"></path><path d="M8.2 9.2L5 11.2l1.4 2.9 1.6-.9V20h8v-6.8l1.6.9 1.4-2.9-3.2-2c-.8.9-2.2 1.4-3.8 1.4s-3-.5-3.8-1.4z"></path><path d="M8.5 4.8v3.2M15.5 4.8v3.2"></path></svg></span><span class="md-caption">Mini 28 pt</span></div>
</div>
</body>
</html>
