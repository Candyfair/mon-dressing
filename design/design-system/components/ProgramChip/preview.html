<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ProgramChip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap">
</head>
<body>
<div class="md-stage">
<button class="md-chip md-glass">
<span>Bureau</span>
<span class="md-chip-divider" aria-hidden="true"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="à vélo"><circle cx="5.5" cy="16" r="3.5"></circle><circle cx="18.5" cy="16" r="3.5"></circle><path d="M5.5 16 L9.5 8.5 H15.5 L18.5 16 M9.5 8.5 L12 16 L15.5 8.5 M12 16 H5.5 M9.5 8.5 V6 M8 6 H11 M15.5 8.5 L14.8 5.5 H17"></path></svg>
</button>
<button class="md-chip md-glass">
<span>Détente</span>
<span class="md-chip-divider" aria-hidden="true"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="à pied"><circle cx="13.5" cy="4.5" r="1.8"></circle><path d="M10.5 21 L12 15 L14.5 17.5 V21 M12 15 L12.8 9 L9.5 10.5 L8.5 13.5 M12.8 9 L15 12 L17.5 13"></path></svg>
</button>
<button class="md-chip md-glass"><span>Télétravail</span></button>
</div>
</body>
</html>
