<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SortCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
</head>
<body>
<div class="md-stage" style="flex-direction: column; align-items: flex-start">
<div class="md-sort-card md-glass"><div style="flex: 1"><h2 class="md-sort-title">Ranger la tenue du jour</h2><p class="md-sort-sub">Appui long sur chaque pièce</p></div><svg width="48" height="48" viewBox="0 0 48 48" aria-label="2 pièces triées sur 5"><circle cx="24" cy="24" r="17" fill="none" stroke="var(--rule)" stroke-opacity="0.14" stroke-width="4"></circle><circle cx="24" cy="24" r="17" fill="none" stroke="var(--select)" stroke-width="4" stroke-linecap="round" stroke-dasharray="42.73 106.81" transform="rotate(-90 24 24)"></circle><text x="24" y="28.5" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="var(--ink)">2/5</text></svg></div>
<div style="display: flex; gap: 12px"><span class="md-status-mini md-sort-linge" role="img" aria-label="Au sale"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="2.5"></rect><circle cx="12" cy="13" r="4.2"></circle><path d="M7.5 6.5h2.5"></path></svg></span><span class="md-status-mini md-sort-reporte" role="img" aria-label="Aérer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h10.5a2.5 2.5 0 1 0-2.5-2.5M3 14h14.5a2.5 2.5 0 1 1-2.5 2.5"></path></svg></span><span class="md-status-mini md-sort-reporte" role="img" aria-label="Ranger"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="17" rx="1.5"></rect><path d="M12 3v17M9.8 10.5v2.5M14.2 10.5v2.5M7 20v1.5M17 20v1.5"></path></svg></span></div>
</div>
</body>
</html>
