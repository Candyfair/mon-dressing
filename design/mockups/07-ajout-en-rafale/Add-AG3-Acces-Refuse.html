<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajout en rafale — accès refusé</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
@keyframes md-shimmer { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -40; } }
.md-cutting { animation: md-shimmer 1.2s linear infinite; }
@media (prefers-reduced-motion: reduce) { .md-cutting { animation: none; } }
</style>
</head>
<body>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #131B16; font-family: 'Instrument Sans', system-ui, sans-serif; color: #F4EFE3">
<header style="position: absolute; top: 50px; left: 16px"><button aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: rgba(19,27,22,0.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.18); color: #F4EFE3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></header>
<section aria-labelledby="perm-title" style="position: absolute; left: 32px; right: 32px; top: 250px; display: flex; flex-direction: column; align-items: center; text-align: center">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(244,239,227,0.08); border: 1px solid rgba(255,255,255,0.14)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.5 5h5l1.5 2h3a1.5 1.5 0 0 1 1.5 1.5v8M17 19H4.5A1.5 1.5 0 0 1 3 17.5v-9A1.5 1.5 0 0 1 4.5 7H7"></path><path d="M9.9 10.2a3 3 0 0 0 4 4"></path></svg></span>
<h2 id="perm-title" style="margin: 22px 0 0; font-family: 'Space Grotesk', 'Instrument Sans', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.02em; line-height: 1.15">L’appareil photo est désactivé</h2>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: #C3CAB8">Mon Dressing en a besoin pour photographier vos vêtements. Vous pouvez l’autoriser dans les réglages du téléphone.</p>
<button style="margin-top: 26px; height: 52px; padding: 0 26px; border-radius: 26px; background: #D8A93B; color: #1E3120; font-size: 15px; font-weight: 600">Ouvrir les réglages</button>
<button style="margin-top: 12px; height: 44px; color: #E3E8DA; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Choisir dans la galerie</button>
</section>

</div>
</body>
</html>
