<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Premier lancement — sombre</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:#E3E8DA}a:hover{color:#F4EFE3}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; box-sizing: border-box; background: #131B16; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; color: #F4EFE3">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 375px; height: 360px; pointer-events: none; background: linear-gradient(to bottom, #1E3631 0%, rgba(30,54,49,0.55) 45%, rgba(30,54,49,0) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 375px; height: 300px; pointer-events: none; background: radial-gradient(ellipse 85% 100% at 0% 100%, #1A2E2A 0%, rgba(26,46,42,0) 100%)"></div>
<div aria-hidden="true" style="position: absolute; top: 210px; left: 20px; width: 335px; height: 480px; pointer-events: none; background: radial-gradient(ellipse closest-side, rgba(244,239,227,0.05) 0%, rgba(244,239,227,0) 100%)"></div>
<svg aria-hidden="true" width="375" height="812" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.07"><filter id="grain-am1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="375" height="812" filter="url(#grain-am1)"></rect></svg>

<section aria-labelledby="hello" style="position: absolute; left: 24px; right: 24px; top: 150px; display: flex; flex-direction: column; align-items: flex-start">
<p style="margin: 0; font-family: 'Space Grotesk', 'Instrument Sans', sans-serif; font-weight: 600; font-size: 18px; color: #E3E8DA">Mon Dressing</p>
<h1 id="hello" style="margin: 14px 0 0; font-family: 'Space Grotesk', 'Instrument Sans', sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.03em; line-height: 1.02">Chaque matin, une tenue prête selon la météo et votre journée.</h1>
<p style="margin: 16px 0 0; font-size: 15px; line-height: 1.45; color: #C3CAB8">Avec les vêtements que vous avez vraiment, et rien à remplir chaque jour.</p>
</section>
<div role="img" aria-label="Personnage météo : grenouille" style="position: absolute; right: 32px; top: 470px; width: 116px; height: 116px; box-sizing: border-box; border-radius: 20px; border: 1.5px dashed rgba(244,239,227,0.40); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #C3CAB8"><span style="font-weight: 600">Grenouille</span><span>accueil</span></div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 48px; display: flex; flex-direction: column; gap: 10px">
<button style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #D8A93B; color: #1E3120; font-size: 15px; font-weight: 600">Créer mon dressing</button>
<button style="height: 52px; border-radius: 26px; border: 1px solid rgba(244,239,227,0.35); color: #E3E8DA; font-size: 15px; font-weight: 600; text-align: center">Découvrir avec un dressing de démo</button>
</div>

</div>
</body>
</html>
