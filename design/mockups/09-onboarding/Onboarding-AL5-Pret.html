<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onboarding — prêt</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:#2F4A2B}a:hover{color:#1E3120}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; box-sizing: border-box; background: #FAF7F0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; color: #1E3120">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 375px; height: 290px; overflow: hidden; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%)">
<div style="position: absolute; top: -170px; left: -120px; width: 560px; height: 420px; border-radius: 50%; background: radial-gradient(ellipse, #8FAE9E 0%, rgba(143,174,158,0.6) 35%, rgba(143,174,158,0) 70%); filter: blur(20px)"></div>
<div style="position: absolute; top: -60px; right: -160px; width: 380px; height: 340px; border-radius: 50%; background: radial-gradient(circle, #A9B9A0 0%, rgba(169,185,160,0) 66%); filter: blur(18px)"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div style="position: absolute; top: 600px; left: -170px; width: 340px; height: 380px; background: radial-gradient(ellipse closest-side, #8FAE9E 0%, rgba(143,174,158,0.5) 50%, rgba(143,174,158,0) 100%); filter: blur(18px)"></div>
<div style="position: absolute; top: 720px; left: 250px; width: 280px; height: 240px; background: radial-gradient(ellipse closest-side, #A9B9A0 0%, rgba(169,185,160,0.5) 50%, rgba(169,185,160,0) 100%); filter: blur(18px)"></div>
</div>

<section aria-labelledby="ready" style="position: absolute; left: 24px; right: 24px; top: 170px; display: flex; flex-direction: column; align-items: center; text-align: center">
<div role="img" aria-label="Personnage météo : grenouille" style="width: 116px; height: 116px; box-sizing: border-box; border-radius: 20px; border: 1.5px dashed rgba(47,74,43,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #3F4F3C"><span style="font-weight: 600">Grenouille</span><span>contente</span></div>
<h1 id="ready" style="margin: 26px 0 0; font-family: 'Space Grotesk', 'Instrument Sans', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -0.02em; line-height: 1.08">Il ne manque que vos vêtements</h1>
<p style="margin: 12px 0 0; max-width: 300px; font-size: 15px; line-height: 1.45; color: #3F4F3C">Photographiez-les à la suite : quelques secondes par pièce. Commencez par les hauts, les bas et une paire de chaussures.</p>
</section>
<div style="position: absolute; left: 24px; right: 24px; bottom: 48px; display: flex; flex-direction: column; gap: 10px">
<button style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #2F4A2B; color: #F4EFE3; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="12.5" r="3.2"></circle></svg>Commencer l’ajout en rafale</button>
<button style="height: 52px; border-radius: 26px; border: 1px solid rgba(47,74,43,0.45); color: #2F4A2B; font-size: 15px; font-weight: 600; text-align: center">Essayer avec le dressing de démo</button>
<button style="height: 44px; color: #2F4A2B; font-size: 15px; font-weight: 600; text-align: center">Plus tard</button>
</div>

</div>
</body>
</html>
