plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.candyfairstudio'
version = '1.0.0'

android {
  namespace "com.candyfairstudio.subjectcutout"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Subject Segmentation ships only through Google Play services (beta): the model is not in the APK.
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // ModuleInstallClient, to check for the model and download it on demand.
  implementation "com.google.android.gms:play-services-base:18.11.1"
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}
